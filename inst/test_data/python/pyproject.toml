[project]
name = "infostop-reference"
version = "0.0.1"
description = "Generates Python infostop reference outputs for infostop tests"
requires-python = ">=3.12,<3.13"
dependencies = [
  "infostop",
  "numpy>=1.26,<1.27",
  "pandas>=2.3,<2.4",
  "infomap==1.0.6",
]

[tool.uv]
package = false

[tool.uv.extra-build-dependencies]
infomap = ["setuptools<81"]
infostop = ["setuptools", "pybind11"]
